# Server Configuration
server.port=8083


# Database Configuration
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/panchmukhi_trading
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms 
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8

# MongoDB Configuration - Disabled
spring.data.mongodb.uri=mongodb://panchmukhi_admin:your_secure_password@localhost:27017/panchmukhi_logs?authSource=admin
# spring.data.mongodb.uri=mongodb://postgres:admin123:27017/panchmukhi_logs?authSource=postgres
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# Security Configuration
jwt.secret=panchmukhi-256-bit-super-secure-key-1234567890-ABCDEFGHIJ
# JWT token expiration: 1 hour (in milliseconds)
jwt.expiration=3600000
# JWT refresh token expiration: 30 days (in milliseconds)
jwt.refresh-expiration=2592000000

# WebSocket Configuration
spring.websocket.max-text-message-size=1048576
spring.websocket.max-binary-message-size=1048576

# Logging
logging.level.com.panchmukhi.trading=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8080
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Rate Limiting
rate.limit.enabled=true
rate.limit.requests-per-minute=100
rate.limit.requests-per-hour=1000

# ML Service Configuration
ml.service.url=http://localhost:8000
ml.service.timeout=30000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true