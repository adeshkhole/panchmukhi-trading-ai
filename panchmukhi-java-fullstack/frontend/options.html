<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Chain - Panchmukhi Trading Brain Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #1A1A1A; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
    </style>
</head>
<body>
    <div id="site-header"></div>
    <script src="js/include-header.js"></script>

    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <div class="glass-card p-12 max-w-lg w-full">
            <h1 class="text-4xl font-bold mb-4 text-orange-500">Coming Soon</h1>
            <p class="text-gray-300 mb-8">The Options Chain analysis module is currently under development and will be available shortly.</p>
            <a href="index.html" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                Back to Dashboard
            </a>
        </div>
    </div>
    <script src="js/options.js"></script>
    <script src="js/options.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             // Delay slightly to ensure main.js and app are initialized
            setTimeout(() => {
                if (window.app && !window.app.checkAccess(2)) { // Require PRO level
                    document.body.innerHTML = ''; // Clear content or show blur
                    window.app.showUpgradeModal();
                    // Optional: redirect after delay
                    // setTimeout(() => window.location.href = 'index.html', 3000);
                }
            }, 500);
        });
    </script>
</body>
</html>
