<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Panchmukhi Trading Brain Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #1A1A1A; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-black relative overflow-hidden">
    <!-- Animated Background -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-gray-900 via-black to-gray-900"></div>
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-orange-600/20 rounded-full blur-3xl filter animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl filter animate-pulse" style="animation-delay: 1s;"></div>
    </div>

    <div class="glass-card p-8 w-full max-w-md relative z-10 mx-4">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold mb-2 gradients-text text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-orange-600">Join Revolution</h1>
            <p class="text-gray-400">Create your AI trading account</p>
        </div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-300 mb-1">Full Name</label>
                <input type="text" id="name" name="name" required class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all outline-none" placeholder="John Doe">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all outline-none" placeholder="john@example.com">
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-300 mb-1">Phone Number</label>
                <input type="tel" id="phone" name="phone" required class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all outline-none" placeholder="+91 98765 43210">
            </div>
            <div>
                <label for="plan" class="block text-sm font-medium text-gray-300 mb-1">Select Plan</label>
                <select id="plan" name="plan" class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all outline-none">
                    <option value="FREE">Basic (Free)</option>
                    <option value="PRO">Pro (₹999/mo) - Real-time Signals</option>
                    <option value="PREMIUM">Premium (₹2499/mo) - Full Access</option>
                </select>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="password" name="password" required class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all outline-none" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-orange-500 to-orange-700 hover:from-orange-600 hover:to-orange-800 text-white font-bold rounded-lg shadow-lg transform hover:-translate-y-0.5 transition-all duration-200">
                Create Account
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-gray-400">
            Already have an account? <a href="login.html" class="text-orange-400 hover:text-orange-300 font-medium transition-colors">Sign in</a>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
