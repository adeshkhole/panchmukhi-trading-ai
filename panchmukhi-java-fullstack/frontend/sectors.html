<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector Intelligence - Panchmukhi Trading</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --background: #0f1419;
            --background-darker: #0a0e13;
            --card-background: rgba(26, 26, 46, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-color: #ff6b35;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1a2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        
        .sectors-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }
        
        .page-header {
            margin-bottom: 40px;
            text-align: center;
        }
        
        .page-header h1 {
            font-size: 42px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .page-header p {
            color: var(--text-secondary);
            font-size: 16px;
        }
        
        .heatmap-section {
            background: var(--card-background);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .heatmap-section h2 {
            margin: 0 0 20px;
            color: var(--text-primary);
            font-size: 24px;
        }
        
        #sector-heatmap {
            width: 100%;
            height: 500px;
            border-radius: 12px;
        }
        
        .sector-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .sector-card {
            background: var(--card-background);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        
        .sector-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            border-color: var(--accent-color);
        }
        
        .sector-card h3 {
            margin: 0 0 15px;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sentiment-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .sentiment-badge.bullish {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }
        
        .sentiment-badge.bearish {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        
        .sentiment-badge.neutral {
            background: rgba(107, 114, 128, 0.1);
            color: #6b7280;
        }
        
        .sector-stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .sector-stat strong {
            color: var(--text-primary);
        }
        
        .sector-stat span {
            color: var(--text-secondary);
        }
        
        .projects-section {
            background: var(--card-background);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border-color);
        }
        
        .projects-section h2 {
            margin: 0 0 20px;
            color: var(--text-primary);
        }
        
        .project-card {
            background: var(--background-darker);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
        }
        
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .project-title {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .project-type {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }
        
        .project-details {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="site-header"></div>
    <script src="js/include-header.js"></script>

    <!-- Main Content -->
    <div class="sectors-container">
        <div class="page-header">
            <h1>📊 Sector Intelligence</h1>
            <p>Real-time sector sentiment analysis and trending company projects</p>
        </div>

        <!-- Sector Heatmap -->
        <div class="heatmap-section">
            <h2>Sector Sentiment Heatmap</h2>
            <div id="sector-heatmap"></div>
        </div>

        <!-- Sector Cards -->
        <div id="sector-cards" class="sector-cards">
            <div class="loading">Loading sector data...</div>
        </div>

        <!-- Company Projects -->
        <div class="projects-section">
            <h2>Recent Company Projects</h2>
            <div id="projects-list">
                <div class="loading">Loading projects...</div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/sector-heatmap.js"></script>
    <script>
        // Load sector cards
        async function loadSectorCards() {
            try {
                const sectors = await window.apiClient.get('/sector-intelligence/public/all');
                const container = document.getElementById('sector-cards');
                
                if (!sectors || sectors.length === 0) {
                    container.innerHTML = '<div class="loading">No sector data available</div>';
                    return;
                }
                
                container.innerHTML = sectors.map(sector => `
                    <div class="sector-card">
                        <h3>
                            ${sector.sectorName}
                            <span class="sentiment-badge ${getSentimentClass(sector.sentimentScore)}">
                                ${getSentimentIcon(sector.sentimentScore)} ${getSentimentLabel(sector.sentimentScore)}
                            </span>
                        </h3>
                        <div class="sector-stat">
                            <strong>Trend:</strong>
                            <span>${sector.currentTrend || 'N/A'}</span>
                        </div>
                        <div class="sector-stat">
                            <strong>News Count:</strong>
                            <span>${sector.newsCount || 0} articles</span>
                        </div>
                        <div class="sector-stat">
                            <strong>Sentiment Score:</strong>
                            <span>${sector.sentimentScore ? sector.sentimentScore.toFixed(2) : '0.00'}</span>
                        </div>
                        ${sector.topStory ? `
                            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color);">
                                <strong style="font-size: 12px; color: var(--text-secondary);">Top Story:</strong>
                                <p style="font-size: 13px; margin-top: 5px; color: var(--text-primary);">${sector.topStory}</p>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load sectors:', error);
                document.getElementById('sector-cards').innerHTML = 
                    '<div class="loading">Failed to load sector data</div>';
            }
        }
        
        // Load company projects
        async function loadProjects() {
            try {
                const projects = await window.apiClient.get('/projects/public/recent');
                const container = document.getElementById('projects-list');
                
                if (!projects || projects.length === 0) {
                    container.innerHTML = '<div class="loading">No recent projects</div>';
                    return;
                }
                
                container.innerHTML = projects.map(project => `
                    <div class="project-card">
                        <div class="project-header">
                            <span class="project-title">${project.companyName} - ${project.projectTitle}</span>
                            <span class="project-type">${project.projectType}</span>
                        </div>
                        <div class="project-details">
                            ${project.description || ''}
                            ${project.investmentAmount ? `<br><strong>Investment:</strong> ₹${project.investmentAmount.toLocaleString('en-IN')} Cr` : ''}
                            ${project.location ? `<br><strong>Location:</strong> ${project.location}` : ''}
                            ${project.status ? `<br><strong>Status:</strong> ${project.status}` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load projects:', error);
                document.getElementById('projects-list').innerHTML = 
                    '<div class="loading">Failed to load projects</div>';
            }
        }
        
        // Utility functions
        function getSentimentClass(score) {
            if (!score) return 'neutral';
            if (score > 0.3) return 'bullish';
            if (score < -0.3) return 'bearish';
            return 'neutral';
        }
        
        function getSentimentIcon(score) {
            if (!score) return '⚖️';
            if (score > 0.3) return '📈';
            if (score < -0.3) return '📉';
            return '⚖️';
        }
        
        function getSentimentLabel(score) {
            if (!score) return 'Neutral';
            if (score > 0.3) return 'Bullish';
            if (score < -0.3) return 'Bearish';
            return 'Neutral';
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSectorCards();
            loadProjects();
        });
    </script>
</body>
</html>
