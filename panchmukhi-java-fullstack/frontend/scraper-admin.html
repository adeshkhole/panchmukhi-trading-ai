<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Scraper - Panchmukhi Trading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --background: #0f1419;
            --background-darker: #0a0e13;
            --card-background: rgba(26, 26, 46, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-color: #ff6b35;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1a2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }
    </style>
    <link rel="stylesheet" href="css/scraper-admin.css">
</head>
<body>
    <!-- Navigation -->
    <div id="site-header"></div>
    <script src="js/include-header.js"></script>

    <!-- Main Content -->
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔧 Web Scraper Configuration</h1>
            <div class="header-actions">
                <div class="stats">
                    <span class="stat-item">
                        <strong id="total-scrapers">0</strong> Total
                    </span>
                    <span class="stat-item">
                        <strong id="active-scrapers">0</strong> Active
                    </span>
                </div>
                <button class="btn-primary" onclick="showAddModal()">
                    <span>➕ Add Scraper</span>
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <select id="category-filter" onchange="filterScrapers()">
                <option value="all">All Categories</option>
                <option value="news">News</option>
                <option value="stocks">Stocks</option>
                <option value="sectors">Sectors</option>
                <option value="isro">ISRO</option>
                <option value="options">Options</option>
            </select>
            <select id="status-filter" onchange="filterScrapers()">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <!-- Scrapers Table -->
        <div class="scrapers-table">
            <table>
                <thead>
                    <tr>
                        <th>Website</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Frequency</th>
                        <th>Last Scraped</th>
                        <th>Success/Fail</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="scrapers-tbody">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="scraper-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Scraper</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="scraper-form">
                <input type="hidden" id="scraper-id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Website Name *</label>
                        <input type="text" id="website-name" required placeholder="MoneyControl, Economic Times">
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="category" required>
                            <option value="news">News</option>
                            <option value="stocks">Stocks</option>
                            <option value="sectors">Sectors</option>
                            <option value="isro">ISRO</option>
                            <option value="options">Options</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Base URL *</label>
                    <input type="url" id="base-url" required placeholder="https://www.moneycontrol.com/news">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="2" placeholder="Brief description of this scraper"></textarea>
                </div>

                <h3>CSS Selectors</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Target Container</label>
                        <input type="text" id="target-selector" placeholder=".article-list">
                        <small>Main container that holds all articles</small>
                    </div>
                    <div class="form-group">
                        <label>Title Selector</label>
                        <input type="text" id="title-selector" placeholder="h2.title">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Content Selector</label>
                        <input type="text" id="content-selector" placeholder="div.content">
                    </div>
                    <div class="form-group">
                        <label>Date Selector</label>
                        <input type="text" id="date-selector" placeholder="span.date">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Image Selector</label>
                        <input type="text" id="image-selector" placeholder="img.article-img">
                    </div>
                    <div class="form-group">
                        <label>Link Selector</label>
                        <input type="text" id="link-selector" placeholder="a.read-more">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Scraping Frequency (minutes)</label>
                        <input type="number" id="scraping-frequency" value="60" min="15" max="1440">
                    </div>
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="is-active" checked>
                            Active
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="testScraper()">
                        🧪 Test Scraper
                    </button>
                    <button type="submit" class="btn-primary">Save Configuration</button>
                </div>
            </form>

            <!-- Test Results -->
            <div id="test-results" style="display: none;">
                <h3>Test Results</h3>
                <div id="test-output"></div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/scraper-admin.js"></script>
</body>
</html>
